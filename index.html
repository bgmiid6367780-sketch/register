<html lang="en">
<head>

    <title>Come Pay</title>
    <link rel="stylesheet" href="view.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: #f8faff;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        /* ------------------ असली ऐप जैसी लोडिंग स्क्रीन ------------------ */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e4e7ed;
            border-top: 5px solid #008952;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #008952;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ------------------ LOGIN SCREEN STYLE ------------------ */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .logo-container {
            margin-top: 50px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-graphic {
            width: 120px;
            height: 100px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape-c {
            width: 65px;
            height: 65px;
            border: 16px solid #1a56da;
            border-right-color: transparent;
            border-radius: 50%;
            position: absolute;
            left: 10px;
        }

        .shape-arrow {
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 40px solid #ff9800;
            position: absolute;
            right: 15px;
            transform: rotate(-15deg);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 900;
            color: #1a56da;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .form-box {
            width: 100%;
            padding: 0 10px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        .input-field {
            width: 100%;
            background: white;
            border: 1px solid #dcdfe6;
            border-radius: 35px;
            padding: 16px 20px 16px 60px;
            font-size: 18px;
            outline: none;
            color: #303133;
        }

        .input-icon-box {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: 2px solid #303133;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-icon-box.lock-icon { border-radius: 6px; height: 24px; }

        .row-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding: 0 5px;
        }

        .green-link {
            color: #008080;
            font-size: 15px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }

        .checkbox-row { display: flex; align-items: center; font-size: 15px; }

        .green-tick-circle {
            width: 18px;
            height: 18px;
            background-color: #72c061;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            margin-right: 8px;
        }

        .privacy-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 35px 0 20px 0;
            font-size: 15px;
        }

        .underline-text { color: #008080; text-decoration: underline; margin-left: 4px; }

        .btn-submit {
            width: 100%;
            background-color: #008952;
            color: white;
            border: none;
            border-radius: 35px;
            padding: 16px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .version-info { position: absolute; bottom: 20px; right: 25px; font-size: 13px; color: #909399; }

        /* ------------------ DASHBOARD (HOME) SCREEN STYLE ------------------ */
        .dashboard-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        
        .avatar-circle {
            width: 45px;
            height: 45px;
            background-color: #d1e3ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .user-meta h4 { font-size: 18px; font-weight: bold; color: #111; }
        .user-meta p { font-size: 14px; color: #666; margin-top: 2px; }
        .copy-icon-btn { display: inline-block; background: #eee; padding: 2px 6px; font-size: 11px; border-radius: 4px; margin-left: 5px; cursor: pointer; }
        
        .noti-icon { font-size: 24px; position: relative; cursor: pointer; }
        .noti-dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: red; border-radius: 50%; }

        .balance-card {
            background: linear-gradient(135deg, #009660, #006b44);
            border-radius: 20px;
            padding: 22px;
            color: white;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,150,96,0.2);
        }

        .balance-title { font-size: 16px; font-weight: 500; opacity: 0.9; }
        .balance-amount { font-size: 36px; font-weight: bold; margin-top: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .btn-detail {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            color: #111;
            border: none;
            border-radius: 20px;
            padding: 8px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .stats-box {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stats-box.deposit-bg { background-color: #008952; color: white; border-right: 1px solid rgba(255,255,255,0.2); }
        .stats-box.withdrawal-bg { background-color: #e6b422; color: white; }
        
        .stats-label { font-size: 15px; font-weight: 500; }
        .stats-val { font-size: 20px; font-weight: bold; }

        .actions-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .action-item-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .action-circle-icon {
            width: 50px;
            height: 50px;
            background: white;
            border: 1px solid #e4e7ed;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            position: relative;
        }
