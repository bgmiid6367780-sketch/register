<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Web SDK (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="register-container">
    <header>
      <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h2>Register</h2>
      <div class="spacer"></div>
    </header>

    <form id="loginForm">
      <div class="input-group">
        <i class="fa-regular fa-user icon"></i>
        <input type="text" id="username" placeholder="User Name" required>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <div class="input-group phone-group">
        <i class="fa-solid fa-phone icon"></i>
        <span class="country-code">+91</span>
        <input type="tel" id="phone" placeholder="Phone" required maxlength="10">
      </div>

      <div class="input-group otp-group">
        <i class="fa-regular fa-envelope icon"></i>
        <input type="text" id="otpCode" placeholder="OTP Code" required maxlength="6">
        <button type="button" class="send-btn" id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-link icon"></i>
        <input type="text" id="inviteCode" placeholder="Invite Code">
      </div>

      <!-- Invisible Recaptcha Box -->
      <div id="recaptcha-container"></div>

      <button type="submit" class="signup-btn">Sign Up</button>
    </form>

    <div id="statusMsg" style="margin-top: 15px; text-align: center; font-weight: 500; display: none;"></div>
  </div>

  <script>
    // स्क्रीनशॉट से ली गई Firebase Config Details
    const firebaseConfig = {
      apiKey: "AIzaSyD-wRwZiXZvrZWMlKA...", // आपकी पूरी API Key बैकएंड में कनेक्ट रहेगी
      authDomain: "rk-pay-3c7e2.firebaseapp.com",
      projectId: "rk-pay-3c7e2",
      storageBucket: "rk-pay-3c7e2.firebasestorage.app",
      messagingSenderId: "945406958282",
      appId: "1:945406958282:web:b6a2cf..."
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const SUPABASE_URL = "https://epktoxtdzinybptgdhdu.supabase.co/rest/v1/users";
    let confirmationResultObj = null;

    function showMsg(text, isError = false) {
      const msgDiv = document.getElementById("statusMsg");
      msgDiv.innerText = text;
      msgDiv.style.color = isError ? "#e74c3c" : "#2ecc71";
      msgDiv.style.display = "block";
    }

    // Invisible Recaptcha Set Up
    window.onload = function() {
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });
    };

    // Firebase OTP Send Logic
    function sendOTP() {
      const phone = document.getElementById("phone").value.trim();
      if (!phone || phone.length !== 10 || isNaN(phone)) {
        showMsg("कृपया 10 अंकों का सही मोबाइल नंबर डालें!", true);
        return;
      }

      const phoneNumber = "+91" + phone;
      const btn = document.getElementById("sendOtpBtn");
      btn.disabled = true;
      btn.innerText = "Wait...";

      const appVerifier = window.recaptchaVerifier;

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then((confirmationResult) => {
          confirmationResultObj = confirmationResult;
          showMsg("OTP आपके मोबाइल नंबर पर SMS द्वारा भेज दिया गया है!");
          
          let seconds = 60;
          const timer = setInterval(() => {
            seconds--;
            btn.innerText = `${seconds}s`;
            if (seconds <= 0) {
              clearInterval(timer);
              btn.disabled = false;
              btn.innerText = "Send";
            }
          }, 1000);
        })
        .catch((error) => {
          showMsg("SMS भेजने में समस्या आई: " + error.message, true);
          btn.disabled = false;
          btn.innerText = "Send";
        });
    }

    // Form Submission & Supabase Entry
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const userOtp = document.getElementById("otpCode").value.trim();
      const inviteCode = document.getElementById("inviteCode").value.trim();

      if (!confirmationResultObj) {
        showMsg("पहले Send पर क्लिक करके OTP मँगवाएँ!", true);
        return;
      }

      showMsg("OTP वेरिफाई हो रहा है...");

      // Verify Firebase OTP
      confirmationResultObj.confirm(userOtp)
        .then(() => {
          showMsg("OTP वेरिफाई हो गया! रजिस्ट्रेशन हो रहा है...");

          // Save to Supabase DB
          fetch(SUPABASE_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              username: username,
              phone_number: phone,
              password: password,
              invite_code: inviteCode
            })
          })
          .then(async (response) => {
            if (response.ok) {
              showMsg("रजिस्ट्रेशन सफलतापूर्वक हो गया!");
              document.getElementById("loginForm").reset();
              confirmationResultObj = null;
            } else {
              const errData = await response.json();
              if (errData.message && errData.message.includes("users_phone_number_key")) {
                showMsg("यह मोबाइल नंबर पहले से रजिस्टर्ड है!", true);
              } else {
                showMsg("डेटाबेस में सेव करने में दिक्कत आई!", true);
              }
            }
          })
          .catch(() => {
            showMsg("नेटवर्क एरर! कृपया दोबारा कोशिश करें।", true);
          });

        })
        .catch(() => {
          showMsg("गलत OTP दर्ज किया गया है!", true);
        });
    });
  </script>
</body>
</html>
