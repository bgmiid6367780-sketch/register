<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .register-container { background-color: #ffffff; width: 100%; max-width: 400px; padding: 30px 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 35px; }
        .header h2 { color: #0d8c54; font-size: 22px; font-weight: 600; }
        .back-btn { color: #0d8c54; font-size: 20px; text-decoration: none; }
        .spacer { width: 20px; }
        .input-group { display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; background-color: #ffffff; }
        .input-group .icon { color: #0d8c54; font-size: 18px; margin-right: 12px; width: 20px; text-align: center; }
        .input-group input { border: none; outline: none; width: 100%; font-size: 15px; color: #333; }
        .phone-group .country-code { font-size: 15px; font-weight: 600; color: #0d8c54; margin-right: 10px; padding-right: 10px; border-right: 1px solid #e2e8f0; }
        .send-btn { background-color: #0d8c54; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500; }
        .signup-btn { background-color: #0d8c54; color: white; border: none; width: 100%; padding: 14px; font-size: 18px; font-weight: 500; border-radius: 30px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="header">
            <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Register</h2>
            <div class="spacer"></div>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-regular fa-user icon"></i>
                <input type="text" id="username" placeholder="User Name" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-group phone-group">
                <i class="fa-solid fa-phone icon"></i>
                <span class="country-code" id="countryCode">91</span>
                <input type="tel" id="phone" placeholder="Phone" required>
            </div>

            <div class="input-group otp-group">
                <i class="fa-regular fa-envelope icon"></i>
                <input type="text" id="otpCode" placeholder="OTP Code" required>
                <button type="button" class="send-btn" id="sendOtpBtn">Send</button>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-link icon"></i>
                <input type="text" id="inviteCode" placeholder="Invite Code">
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>
    </div>

<!-- Supabase Script -->
<script src="https://jsdelivr.net"></script>

<!-- MSG91 Official Widget Script Integration -->
<script type="text/javascript">
  var isOtpVerified = false; // OTP check variable

  // MSG91 configuration object
  var configuration = {
    widgetId: "366873756445393730343634",
    tokenAuth: "562352AuOaK5zVBl6a860e4bP1",
    exposeMethods: true,
    success: (data) => {
        console.log('Success response', data);
        if(data.message === "OTP Verified Successfully" || data.type === "success") {
            isOtpVerified = true;
        }
    },
    failure: (error) => {
        console.log('Failure reason', error);
    }
  };

  // MSG91 script loader engine
  (function loadOtpScript(urls) {
    let i = 0;
    function attempt() {
      const s = document.createElement('script');
      s.src = urls[i];
      s.async = true;
      s.onload = () => {
        if (typeof window.initSendOTP === 'function') {
          window.initSendOTP(configuration);
        }
      };
      s.onerror = () => {
        i++;
        if (i < urls.length) {
          attempt();
        }
      };
      document.head.appendChild(s);
    }
    attempt();
  })([
    'https://msg91.com',
    'https://phone91.com'
  ]);
</script>

<script>
  // Supabase Setup
  const supabaseUrl = 'https://supabase.co';
  const supabaseKey = 'sb_publishable_pQBVukXk63ShneEauRMZYw_F9NyOQ69';
  const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const sendBtn = document.getElementById('sendOtpBtn');
  const form = document.getElementById('loginForm');

  // Send Button Logic using MSG91 SDK
  if (sendBtn) {
      sendBtn.addEventListener('click', function() {
          const phoneInput = document.getElementById('phone').value;
          const countryCode = document.getElementById('countryCode').innerText;

          if (!phoneInput || phoneInput.length < 10) {
              alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें!');
              return;
          }

          const fullPhoneNumber = countryCode + phoneInput;

          try {
              sendBtn.innerText = "Sending...";
              sendBtn.disabled = true;

              // MSG91 Official Engine Trigger
              if (window.sendOTP) {
                  window.sendOTP({ mobile: fullPhoneNumber });
                  alert("MSG91 सर्वर से आपके मोबाइल पर OTP भेज दिया गया है!");
              } else {
                  alert("MSG91 स्क्रिप्ट लोड हो रही है, कृपया 2 सेकंड बाद फिर कोशिश करें!");
              }
          } catch (error) {
              alert("एरर: " + error.message);
          } finally {
              sendBtn.innerText = "Send";
              sendBtn.disabled = false;
          }
      });
  }

  // Form Submit / Verify Logic
  if (form) {  
    form.addEventListener('submit', async function(e) {
      e.preventDefault(); 
      const enteredOtp = document.getElementById('otpCode').value;

      if (!enteredOtp) {
          alert('कृपया पहले OTP कोड डालें!');
          return;
      }

      try {
          // Reset status and manually trigger MSG91 verify engine
          if (window.verifyOTP) {
              window.verifyOTP({ otp: enteredOtp });
              
              // Wait 1 second for verification response
              await new Promise(resolve => setTimeout(resolve, 1200));

              if (!isOtpVerified) {
                  alert('गलत OTP डाला है या वेरिफिकेशन फेल हो गया है!');
                  return;
              }
          } else {
              alert('वेरिफिकेशन इंजन लोड नहीं हुआ, कृपया दोबारा कोशिश करें!');
              return;
          }

          alert('OTP वेरिफिकेशन सफल रहा!');

      } catch (error) {
          alert('वेरिफिकेशन में एरर: ' + error.message);
          return;
      }

      // If OTP is verified, save data to Supabase
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const phoneInput = document.getElementById('phone').value;

      const { data, error } = await _supabase
        .from('users')
        .insert([{ username: username, phone_number: phoneInput, password_hash: password }]);

      if (error) {
        alert('डेटाबेस एरर: ' + error.message);
      } else {
        alert('सफलतापूर्वक डेटा सेव हो गया!');
        form.reset();
        isOtpVerified = false;
      }
    });
  }
</script>
</body>
</html>
