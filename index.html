<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiwaPay</title>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8faff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background-color: #f8faff;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 60px;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #1a56da, #ff9800);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .rupee-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #ff9800;
            color: white;
            font-size: 14px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #1a56da;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .input-item {
            width: 100%;
            background: white;
            border: 1px solid #e4e7ed;
            border-radius: 30px;
            padding: 12px 20px 12px 45px;
            font-size: 16px;
            outline: none;
            color: #303133;
        }

        .input-item::placeholder {
            color: #c0c4cc;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #909399;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding: 0 5px;
        }

        .link-btn {
            color: #008080;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #303133;
            cursor: pointer;
        }

        .custom-check {
            width: 16px;
            height: 16px;
            background-color: #008952;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10px;
            margin-right: 6px;
        }

        .privacy-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0 15px 0;
            font-size: 13px;
        }

        .privacy-link {
            color: #008080;
            text-decoration: underline;
            margin-left: 4px;
        }

        .btn-submit {
            width: 100%;
            background-color: #008952;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,89,82,0.15);
        }

        .forget-wrapper {
            text-align: center;
            margin-top: 20px;
        }

        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 5px;
            background: white;
            margin: -20px -20px 20px -20px;
            border-bottom: 1px solid #e4e7ed;
        }

        .back-arrow {
            font-size: 24px;
            color: #008952;
            cursor: pointer;
            padding-left: 15px;
        }

        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: #008952;
        }

        .phone-flex {
            display: flex;
            align-items: center;
        }

        .country-prefix {
            position: absolute;
            left: 45px;
            font-size: 16px;
            color: #008952;
            font-weight: bold;
        }

        .phone-line {
            position: absolute;
            left: 80px;
            width: 1px;
            height: 18px;
            background: #dcdfe6;
        }

        .phone-input-pad {
            padding-left: 95px !important;
        }

        .otp-container {
            display: flex;
            gap: 10px;
        }

        .btn-send-otp {
            background-color: #71bfa3;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .version-label {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: #909399;
        }
    </style>
</head>
<body>

<div id="app" class="app-container">

    <!-- 1. लॉगिन स्क्रीन -->
    <div v-if="currentScreen === 'login'">
        <div class="logo-section">
            <div class="logo-circle">C<div class="rupee-badge">₹</div></div>
            <div class="logo-text">DiwaPay</div>
        </div>

        <div class="form-group">
            <span class="input-icon">👤</span>
            <input type="tel" v-model="loginForm.phone" class="input-item" placeholder="Phone">
        </div>

        <div class="form-group">
            <span class="input-icon">🔒</span>
            <input type="password" v-model="loginForm.password" class="input-item" placeholder="Password">
        </div>

        <div class="action-row">
            <button class="link-btn" @click="changeScreen('register')">Register</button>
            <div class="checkbox-container">
                <span class="custom-check">✓</span> Remember Me
            </div>
        </div>

        <div class="privacy-row">
            <span class="custom-check">✓</span> Agree <span class="privacy-link">"User Privacy Agreement"</span>
        </div>

        <button class="btn-submit" @click="handleSignIn">Sign In</button>

        <div class="forget-wrapper">
            <button class="link-btn" @click="changeScreen('forget')">Forget Password</button>
        </div>
        
        <div class="version-label">v1.1.7</div>
    </div>

    <!-- 2. रजिस्टर स्क्रीन -->
    <div v-if="currentScreen === 'register'">
        <div class="nav-header">
            <span class="back-arrow" @click="changeScreen('login')">←</span>
            <span class="nav-title">Register</span>
            <span style="width: 40px;"></span>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <span class="input-icon">👤</span>
            <input type="text" v-model="registerForm.username" class="input-item" placeholder="User Name">
        </div>

        <div class="form-group">
            <span class="input-icon">🔒</span>
            <input type="password" v-model="registerForm.password" class="input-item" placeholder="Password">
        </div>

        <div class="form-group phone-flex">
            <span class="input-icon">📞</span>
            <span class="country-prefix">+91</span>
            <div class="phone-line"></div>
            <input type="tel" v-model="registerForm.phone" class="input-item phone-input-pad" placeholder="Phone">
        </div>

        <div class="form-group otp-container">
            <div style="position: relative; flex: 1;">
                <span class="input-icon">✉️</span>
                <input type="text" v-model="registerForm.otp" class="input-item" placeholder="OTP Code">
            </div>
            <button class="btn-send-otp" @click="sendOTP">Send</button>
        </div>

        <div class="form-group">
            <span class="input-icon">🔗</span>
            <input type="text" v-model="registerForm.inviteCode" class="input-item" placeholder="Invite Code">
        </div>

        <button class="btn-submit" style="margin-top: 20px;" @click="handleSignUp">Sign Up</button>
    </div>

    <!-- 3. भूल गए पासवर्ड (Forget Password) स्क्रीन -->
    <div v-if="currentScreen === 'forget'">
        <div class="nav-header">
            <span class="back-arrow" @click="changeScreen('login')">←</span>
            <span class="nav-title">Reset Password</span>
            <span style="width: 40px;"></span>
        </div>

        <div class="logo-section">
            <div class="logo-circle">C<div class="rupee-badge"></div></div>
            <div class="logo-text">DiwaPay</div>
        </div>
