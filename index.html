<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="register-container">
        <!-- Top Navigation -->
        <div class="header">
            <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Register</h2>
            <div class="spacer"></div>
        </div>

        <!-- Form Elements -->
        <form id="loginForm">
            
            <!-- User Name -->
            <div class="input-group">
                <i class="fa-regular fa-user icon"></i>
                <input type="text" id="username" placeholder="User Name" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <!-- Phone Number -->
            <div class="input-group phone-group">
                <i class="fa-solid fa-phone icon"></i>
                <span class="country-code">+91</span>
                <input type="tel" id="phone" placeholder="Phone" required>
            </div>

            <!-- OTP Code -->
            <div class="input-group otp-group">
                <i class="fa-regular fa-envelope icon"></i>
                <input type="text" id="otpCode" placeholder="OTP Code" required>
                <button type="button" class="send-btn" id="sendOtpBtn">Send</button>
            </div>

            <!-- Invite Code -->
            <div class="input-group">
                <i class="fa-solid fa-link icon"></i>
                <input type="text" id="inviteCode" placeholder="Invite Code">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="signup-btn">Sign Up</button>

        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase कनेक्शन
  const supabaseUrl = 'https://epktoxtdzinybptgdhdu.supabase.co';
  const supabaseKey = 'sb_publishable_pQBVukX63ShneEauRMZYw_F9NyOQ69';
  const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

  let generatedOtp = null;
  const sendBtn = document.getElementById('sendOtpBtn');
  const form = document.getElementById('loginForm');

  // सेंड बटन पर क्लिक लॉजिक
  if (sendBtn) {
      sendBtn.addEventListener('click', async function() {
          const phone = document.getElementById('phone').value;

          if (!phone || phone.length < 10) {
              alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें!');
              return;
          }

          // 6 अंकों का रैंडम OTP जनरेट करना
          generatedOtp = Math.floor(100000 + Math.random() * 900000);
          const apiKey = 'cDKq0yIP52CxLmdSTbrtVHOUNQw8fhJ'; 
          const url = `https://www.fast2sms.com/dev/bulkV2?authorization=${apiKey}&route=otp&variables_values=${generatedOtp}&numbers=${phone}`;

          try {
              // CORS से बचने के लिए no-cors मोड या सीधा फेच
              const res = await fetch(url);
              alert("OTP सफलतापूर्वक भेज दिया गया है! (OTP: " + generatedOtp + ")");
          } catch (error) {
              // अगर नेटवर्क या CORS एरर आए तो भी टेस्टिंग के लिए ओटीपी अलर्ट कर देगा ताकि काम न रुके
              alert("OTP जनरेट हो गया: " + generatedOtp);
          }
      });
  }

  // फॉर्म सबमिट लॉजिक
  if (form) {  
    form.addEventListener('submit', async function(e) {
      e.preventDefault(); 

      const enteredOtp = document.getElementById('otpCode').value;

      if (generatedOtp && enteredOtp !== String(generatedOtp)) {
          alert('भाई, गलत OTP डाला है! फिर से चेक कर.');
          return;
      }

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Supabase में डेटा सेव करना
      const { data, error } = await _supabase
        .from('users')
        .insert([
          { phone_number: username, password_hash: password }
        ]);

      if (error) {
        alert('देटा सेव करने में दिक्कत आई: ' + error.message);
      } else {
        alert('डेटा सफलतापूर्वक सेव हो गया!');
        form.reset();
      }
    });
  }
</script>

</body>
</html>
