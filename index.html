<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Come Pay - Login</title>
    <!-- Vue.js CDN (यह सिर्फ पेजों को आपस में जोड़ने के काम आएगा, अभी कोई एक्स्ट्रा कोडिंग नहीं है) -->
    <script src="https://unpkg.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8faff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* मोबाइल स्क्रीन फ्रेम जो आपके स्क्रीनशॉट जैसा दिखेगा */
        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: #f8faff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        /* लोगो सेक्शन डिज़ाइन */
        .logo-container {
            margin-top: 60px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* हूबहू आपके स्क्रीनशॉट जैसा दिखने वाला सुंदर CSS लोगो */
        .logo-graphic {
            width: 130px;
            height: 110px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape-c {
            width: 70px;
            height: 70px;
            border: 18px solid #1a56da;
            border-right-color: transparent;
            border-radius: 50%;
            position: absolute;
            left: 10px;
        }

        .shape-arrow {
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 45px solid #ff9800;
            position: absolute;
            right: 15px;
            transform: rotate(-15deg);
        }

        .wallet-badge {
            position: absolute;
            bottom: 5px;
            right: 25px;
            background: #1a56da;
            border: 3px solid #ff9800;
            width: 32px;
            height: 24px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff9800;
            font-size: 11px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 900;
            color: #1a56da;
            margin-top: 15px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* इनपुट बॉक्स स्टाइलिंग */
        .form-box {
            width: 100%;
            padding: 0 10px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        .input-field {
            width: 100%;
            background: white;
            border: 1px solid #dcdfe6;
            border-radius: 35px;
            padding: 16px 20px 16px 60px;
            font-size: 18px;
            outline: none;
            color: #303133;
        }

        .input-field::placeholder {
            color: #c0c4cc;
        }

        .input-icon-box {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: 2px solid #303133;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-icon-box.lock-icon {
            border-radius: 6px;
            height: 24px;
        }

        .icon-inner {
            font-size: 14px;
            color: #303133;
            font-weight: bold;
        }

        /* कस्टमाइज्ड लिंक्स और कतारें (Rows) */
        .row-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding: 0 5px;
        }

        .green-link {
            color: #008080;
            font-size: 15px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #303133;
        }

        /* गोल हरा टिक मार्क जैसा स्क्रीनशॉट में है */
        .green-tick-circle {
            width: 18px;
            height: 18px;
            background-color: #72c061;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            margin-right: 8px;
            font-weight: bold;
        }

        /* प्राइवेसी एग्रीमेंट वाली लाइन */
        .privacy-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0 25px 0;
            font-size: 15px;
            color: #303133;
        }

        .underline-text {
            text-decoration: underline;
            color: #008080;
            margin-left: 4px;
        }

        /* बड़ा गहरा हरा बटन */
        .btn-signin {
            width: 100%;
            background-color: #008952;
            color: white;
            border: none;
            border-radius: 35px;
            padding: 16px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,137,82,0.15);
        }

        /* भूल गए पासवर्ड का सेक्शन */
        .forget-container {
            text-align: center;
            margin-top: 35px;
        }

        /* ऐप का वर्जन नीचे कोने में */
        .version-info {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 13px;
            color: #909399;
        }
    </style>
</head>
<body>

<div id="app" class="app-container">

    <!-- कम पे (COME PAY) मुख्य लॉगिन स्क्रीन -->
    <div class="logo-container">
        <!-- आपका ग्राफिक लोगो -->
        <div class="logo-graphic">
            <div class="shape-c"></div>
            <div class="shape-arrow"></div>
            <div class="wallet-badge">₹</div>
        </div>
        <div class="logo-text">COME PAY</div>
    </div>

    <div class="form-box">
        <!-- फोन नंबर इनपुट बॉक्स -->
        <div class="input-group">
            <div class="input-icon-box">
                <span class="icon-inner">👤</span>
            </div>
            <input type="tel" class="input-field" placeholder="Phone">
        </div>

        <!-- पासवर्ड इनपुट बॉक्स -->
        <div class="input-group">
            <div class="input-icon-box lock-icon">
                <span class="icon-inner">🔒</span>
            </div>
            <input type="password" class="input-field" placeholder="Password">
        </div>

        <!-- रजिस्टर और रिमेंबर मी रो -->
        <div class="row-links">
            <button class="green-link">Register</button>
            <div class="checkbox-row">
                <span class="green-tick-circle">✓</span> Remember Me
            </div>
        </div>

        <!-- प्राइवेसी पॉलिसी रो -->
        <div class="privacy-container">
            <span class="green-tick-circle">✓</span> Agree<span class="underline-text">"User Privacy Agreement"</span>
        </div>

        <!-- साइन इन बटन -->
        <button class="btn-signin">Sign In</button>

        <!-- फॉरगेट पासवर्ड लिंक -->
        <div class="forget-container">
            <button class="green-link">Forget Password</button>
        </div>
    </div>
    
    <!-- वर्जन लेबल -->
    <div class="version-info">v1.1.7</div>

</div>

<script>
    // सरल Vue सेटअप ताकि भविष्य में आप इसमें जो चाहें जोड़ सकें
    const { createApp } = Vue;
    createApp({
        setup() {
            return {};
        }
    }).mount('#app');
</script>
</body>
</html>
