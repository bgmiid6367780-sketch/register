<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script>
        // यूनिऐप का शुरुआती समय और स्क्रीन साइज़ सेटिंग (जो कोड आपने भेजा था)
        var __UniViewStartTime__ = Date.now();
        var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
          CSS.supports('top: constant(a)'))
        document.write(
          '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
          (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title>Come Pay - Login</title>
    
    <!-- यूनिऐप की डिफ़ॉल्ट सीएसएस फ़ाइल -->
    <link rel="stylesheet" href="view.css" />

    <!-- आपके 'COME PAY' स्क्रीनशॉट का हूबहू सेम टू सेम सुंदर UI स्टाइल -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8faff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* मोबाइल फ्रेम जो स्क्रीन पर एकदम सटीक दिखेगा */
        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: #f8faff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        /* लोगो डिज़ाइन */
        .logo-container {
            margin-top: 60px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-graphic {
            width: 130px;
            height: 110px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape-c {
            width: 70px;
            height: 70px;
            border: 18px solid #1a56da;
            border-right-color: transparent;
            border-radius: 50%;
            position: absolute;
            left: 10px;
        }

        .shape-arrow {
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 45px solid #ff9800;
            position: absolute;
            right: 15px;
            transform: rotate(-15deg);
        }

        .wallet-badge {
            position: absolute;
            bottom: 5px;
            right: 25px;
            background: #1a56da;
            border: 3px solid #ff9800;
            width: 32px;
            height: 24px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff9800;
            font-size: 11px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 900;
            color: #1a56da;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* इनपुट बॉक्स फ़ॉर्म */
        .form-box {
            width: 100%;
            padding: 0 10px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        .input-field {
            width: 100%;
            background: white;
            border: 1px solid #dcdfe6;
            border-radius: 35px;
            padding: 16px 20px 16px 60px;
            font-size: 18px;
            outline: none;
            color: #303133;
        }

        .input-field::placeholder {
            color: #c0c4cc;
        }

        .input-icon-box {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: 2px solid #303133;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-icon-box.lock-icon {
            border-radius: 6px;
            height: 24px;
        }

        .icon-inner {
            font-size: 14px;
            color: #303133;
            font-weight: bold;
        }

        .row-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding: 0 5px;
        }

        .green-link {
            color: #008080;
            font-size: 15px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #303133;
        }

        .green-tick-circle {
            width: 18px;
            height: 18px;
            background-color: #72c061;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            margin-right: 8px;
            font-weight: bold;
        }

        .privacy-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0 25px 0;
            font-size: 15px;
            color: #303133;
        }

        .underline-text {
            text-decoration: underline;
            color: #008080;
            margin-left: 4px;
        }

        .btn-signin {
            width: 100%;
            background-color: #008952;
            color: white;
            border: none;
            border-radius: 35px;
            padding: 16px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,137,82,0.15);
        }

        .forget-container {
            text-align: center;
            margin-top: 35px;
        }

        .version-info {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 13px;
            color: #909399;
        }
    </style>
</head>
<body>

    <!-- यूनिऐप का मुख्य खाली ढांचा डिब्बा (यह भी फ़ाइल में मौजूद रहेगा) -->
    <div id="app">
        
        <!-- हमारा 'COME PAY' मुख्य लॉगिन विजुअल फ्रेम इसके अंदर खुलेगा -->
        <div class="app-container">
            <div class="logo-container">
                <div class="logo-graphic">
                    <div class="shape-c"></div>
                    <div class="shape-arrow"></div>
                    <div class="wallet-badge"></div>
                </div>
                <div class="logo-text">COME PAY</div>
            </div>

            <div class="form-box">
                <div class="input-group">
                    <div class="input-icon-box">
                        <span class="icon-inner">👤</span>
                    </div>
                    <input type="tel" class="input-field" placeholder="Phone">
                </div>

                <div class="input-group">
                    <div class="input-icon-box lock-icon">
                        <span class="icon-inner">🔒</span>
                    </div>
                    <input type="password" class="input-field" placeholder="Password">
                </div>

                <div class="row-links">
                    <button type="button" class="green-link">Register</button>
                    <div class="checkbox-row">
                        <span class="green-tick-circle">✓</span> Remember Me
                    </div>
                </div>

                <div class="privacy-container">
                    <span class="green-tick-circle">✓</span> Agree<span class="underline-text">"User Privacy Agreement"</span>
                </div>

                <button type="button" class="btn-signin">Sign In</button>

                <div class="forget-container">
                    <button type="button" class="green-link">Forget Password</button>
                </div>
            </div>
            
            <div class="version-info">v1.1.7</div>
        </div>

    </div>

    <!-- यूनिऐप के इंजन की वो तीनों फाइलें जो बैकग्राउंड का दरवाजा चालू रखेंगी -->
    <script src="__uniappes6.js"></script>
    <script src="view.umd.min.js"></script>
    <script src="app-view.js"></script>
</body>
</html>
