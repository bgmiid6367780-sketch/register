form.addEventListener('submit', async function(e) {

// --- OTP वाला नया कोड ---
async function sendOTP(phone) {
    const otp = Math.floor(100000 + Math.random() * 900000); 
    const apiKey = 'cDKq0yIP52CxLmdSTbrtVHOUNQw8fhJ'; 
    const url = `https://www.fast2sms.com/dev/bulkV2?authorization=${apiKey}&route=otp&variables_values=${otp}&numbers=${phone}`;

    try {
        const res = await fetch(url);
        const data = await res.json();
        
        if(data.return) {
            alert("OTP आपके नंबर पर भेजा गया!");
            return otp; // ये OTP हमें वेरीफाई करने के लिए चाहिए
        } else {
            alert("मैसेज नहीं गया: " + data.message);
        }

        alert("कुछ गड़बड़ हो गई, चेक करो!");
