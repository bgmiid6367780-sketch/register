<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiwaPay</title>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f4f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* मुख्य मोबाइल फ्रेम कंटेनर */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: #f8faff;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow-x: hidden;
        }

        /* लोगो डिज़ाइन */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #1a56da, #ff9800);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 46px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(26,86,218,0.2);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            color: #1a56da;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* इनपुट बॉक्स और फॉर्म सेटिंग्स */
        .form-group {
            width: 100%;
            margin-bottom: 18px;
            position: relative;
        }

        .input-item {
            width: 100%;
            background: white;
            border: 1px solid #e4e7ed;
            border-radius: 30px;
            padding: 14px 20px 14px 45px;
            font-size: 16px;
            outline: none;
            color: #303133;
            transition: all 0.3s;
        }

        .input-item:focus {
            border-color: #008952;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #1a56da;
        }

        /* लिंक और रो सेटिंग्स */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding: 0 5px;
        }

        .link-btn {
            color: #008080;
            font-size: 15px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 500;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #303133;
        }

        .custom-check {
            width: 18px;
            height: 18px;
            background-color: #008952;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            margin-right: 6px;
        }

        .privacy-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 35px 0 20px 0;
            font-size: 14px;
        }

        .privacy-link {
            color: #008080;
            text-decoration: underline;
            margin-left: 4px;
        }

        /* मुख्य हरा बटन */
        .btn-submit {
            width: 100%;
            background-color: #008952;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,137,82,0.2);
        }

        .btn-submit:active {
            background-color: #006b40;
        }

        .forget-wrapper {
            text-align: center;
            margin-top: 25px;
        }

        /* टॉप हेडर बार (सिर्फ रजिस्टर और रीसेट पेज के लिए) */
        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 5px;
            background: white;
            margin: -20px -20px 25px -20px;
            border-bottom: 1px solid #e4e7ed;
        }

        .back-arrow {
            font-size: 26px;
            color: #008952;
            cursor: pointer;
            padding-left: 15px;
            font-weight: bold;
        }

        .nav-title {
            font-size: 19px;
            font-weight: bold;
            color: #008952;
        }

        /* फोन नंबर इनपुट प्रीफिक्स */
        .phone-flex {
            display: flex;
            align-items: center;
        }

        .country-prefix {
            position: absolute;
            left: 45px;
            font-size: 16px;
            color: #008952;
            font-weight: bold;
        }

        .phone-line {
            position: absolute;
            left: 82px;
            width: 1px;
            height: 20px;
            background: #dcdfe6;
        }

        .phone-input-pad {
            padding-left: 95px !important;
        }

        /* ओटीपी बॉक्स और सेंड बटन */
        .otp-container {
            display: flex;
            gap: 10px;
        }

        .btn-send-otp {
            background-color: #71bfa3;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-send-otp:disabled {
            background-color: #c0c4cc;
            cursor: not-allowed;
        }

        .version-label {
            position: absolute;
            bottom: 25px;
            right: 25px;
            font-size: 13px;
            color: #909399;
        }
    </style>
</head>
<body>

<div id="app" class="app-container">

    <!-- SCREEN 1: सिर्फ लॉगिन (Home) स्क्रीन - शुरुआत में सिर्फ यही दिखेगी -->
    <div v-if="currentScreen === 'login'">
        <div class="logo-section">
            <div class="logo-circle">C</div>
            <div class="logo-text">DiwaPay</div>
        </div>

        <div class="form-group">
            <span class="input-icon">👤</span>
            <input type="tel" v-model="loginForm.phone" class="input-item" placeholder="Phone">
        </div>

        <div class="form-group">
            <span class="input-icon">🔒</span>
            <input type="password" v-model="loginForm.password" class="input-item" placeholder="Password">
        </div>

        <div class="action-row">
            <!-- इस पर क्लिक करने से रजिस्टर स्क्रीन खुलेगी -->
            <button class="link-btn" @click="changeScreen('register')">Register</button>
            <div class="checkbox-container">
                <span class="custom-check">✓</span> Remember Me
            </div>
        </div>

        <div class="privacy-row">
            <span class="custom-check">✓</span> Agree <span class="privacy-link">"User Privacy Agreement"</span>
        </div>

        <button class="btn-submit" @click="handleSignIn">Sign In</button>

        <div class="forget-wrapper">
            <!-- इस पर क्लिक करने से रीसेट स्क्रीन खुलेगी -->
            <button class="link-btn" @click="changeScreen('forget')">Forget Password</button>
        </div>
        
        <div class="version-label">v1.1.7</div>
    </div>

    <!-- SCREEN 2: रजिस्टर स्क्रीन - यह डिफ़ॉल्ट रूप से छुपी रहेगी -->
    <div v-if="currentScreen === 'register'">
        <div class="nav-header">
            <span class="back-arrow" @click="changeScreen('login')">←</span>
            <span class="nav-title">Register</span>
            <span style="width: 40px;"></span>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <span class="input-icon">👤</span>
            <input type="text" v-model="registerForm.username" class="input-item" placeholder="User Name">
        </div>

        <div class="form-group">
            <span class="input-icon">🔒</span>
            <input type="password" v-model="registerForm.password" class="input-item" placeholder="Password">
        </div>

        <div class="form-group phone-flex">
            <span class="input-icon">📞</span>
            <span class="country-prefix">+91</span>
            <div class="phone-line"></div>
            <input type="tel" v-model="registerForm.phone" class="input-item phone-input-pad" placeholder="Phone">
        </div>

        <div class="form-group otp-container">
            <div style="position: relative; flex: 1;">
                <span class="input-icon">✉️</span>
                <input type="text" v-model="registerForm.otp" class="input-item" placeholder="OTP Code">
            </div>
            <!-- ओटीपी भेजने का असली बटन -->
            <button class="btn-send-otp" :disabled="otpCountdown > 0" @click="sendOTP">
                {{ otpCountdown > 0 ? otpCountdown + 's' : 'Send' }}
            </button>
        </div>

        <div class="form-group">
            <span class="input-icon">🔗</span>
            <input type="text" v-model="registerForm.inviteCode" class="input-item" placeholder="Invite Code">
        </div>

        <button class="btn-submit" style="margin-top: 15px;" @click="handleSignUp">Sign Up</button>
    </div>
