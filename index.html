<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="register-container">
        <!-- Top Navigation -->
        <div class="header">
            <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Register</h2>
            <div class="spacer"></div>
        </div>

        <!-- Form Elements -->
        <form id="loginForm">
            
            <!-- User Name -->
            <div class="input-group">
                <i class="fa-regular fa-user icon"></i>
                <input type="text" id="username" placeholder="User Name" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <!-- Phone Number -->
            <div class="input-group phone-group">
                <i class="fa-solid fa-phone icon"></i>
                <span class="country-code" id="countryCode">+91</span>
                <input type="tel" id="phone" placeholder="Phone" required>
            </div>

            <!-- OTP Code -->
            <div class="input-group otp-group">
                <i class="fa-regular fa-envelope icon"></i>
                <input type="text" id="otpCode" placeholder="OTP Code" required>
                <button type="button" class="send-btn" id="sendOtpBtn">Send</button>
            </div>

            <!-- Firebase सुरक्षा वेरिफिकेशन बॉक्स के लिए जगह (यह अदृश्य रहेगा) -->
            <div id="recaptcha-container" style="margin-bottom: 15px; display: flex; justify-content: center;"></div>

            <!-- Invite Code -->
            <div class="input-group">
                <i class="fa-solid fa-link icon"></i>
                <input type="text" id="inviteCode" placeholder="Invite Code">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="signup-btn">Sign Up</button>

        </form>
    </div>

<!-- Supabase SDK (टूटे हुए लिंक्स को ठीक कर दिया) -->
<script src="https://jsdelivr.net"></script>

<!-- Firebase SDK मॉड्यूल (इसके ज़रिए असली OTP फोन पर जाएगा) -->
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAnalytics } from "https://gstatic.com";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://gstatic.com";

  // आपका Firebase कॉन्फ़िगरेशन
  const firebaseConfig = {
    apiKey: "AIzaSyD-wRwZiXZvrZWMlKAlxGvc_4I_yjXh7Uc",
    authDomain: "rk-pay-3c7e2.firebaseapp.com",
    projectId: "rk-pay-3c7e2",
    storageBucket: "rk-pay-3c7e2.firebasestorage.app",
    messagingSenderId: "945406958282",
    appId: "1:945406958282:web:863a1bff293441d665b233",
    measurementId: "G-7GE17PRFR1"
  };

  // Firebase चालू करना
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  // ग्लोबल वेरिएबल ताकि नीचे वाला स्क्रिप्ट इसे पढ़ सके
  window.firebaseAuth = auth;
  window.RecaptchaVerifier = RecaptchaVerifier;
  window.signInWithPhoneNumber = signInWithPhoneNumber;
</script>

<script>
  // Supabase कनेक्शन सेटअप
  const supabaseUrl = 'https://epktoxtdzinybptgdhdu.supabase.co';
  const supabaseKey = 'sb_publishable_pQBVukXk63ShneEauRMZYw_F9NyOQ69';
  const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

  let confirmationResult = null; 
  const sendBtn = document.getElementById('sendOtpBtn');
  const form = document.getElementById('loginForm');

  // Firebase सुरक्षा कैप्चा सेट करना
  function setupRecaptcha() {
      if (!window.recaptchaVerifier) {
          window.recaptchaVerifier = new window.RecaptchaVerifier(window.firebaseAuth, 'recaptcha-container', {
              'size': 'invisible', 
              'callback': (response) => {
                  console.log("Recaptcha verified!");
              },
              'expired-callback': () => {
                  alert("कैप्चा एक्सपायर हो गया, कृपया फिर से कोशिश करें।");
              }
          });
          window.recaptchaVerifier.render();
      }
  }

  // ओटीपी भेजने का लॉजिक (Firebase Phone Auth)
  if (sendBtn) {
      sendBtn.addEventListener('click', async function() {
          const phoneInput = document.getElementById('phone').value;
          const countryCode = document.getElementById('countryCode').innerText;

          if (!phoneInput || phoneInput.length < 10) {
              alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें!');
              return;
          }

          // पूरा नंबर बनाना (जैसे: +919876543210)
          const fullPhoneNumber = countryCode + phoneInput;

          try {
              sendBtn.innerText = "Sending...";
              sendBtn.disabled = true;

              setupRecaptcha();
              const appVerifier = window.recaptchaVerifier;

              // गिटहब डोमेन से सीधा असली SMS भेजना
              confirmationResult = await window.signInWithPhoneNumber(window.firebaseAuth, fullPhoneNumber, appVerifier);
              
              alert("Firebase की तरफ से आपके मोबाइल पर असली OTP भेज दिया गया है!");
          } catch (error) {
              alert("OTP भेजने में फेल: " + error.message);
              console.error(error);
              if (window.recaptchaVerifier) {
                  window.recaptchaVerifier.clear();
                  window.recaptchaVerifier = null;
              }
          } finally {
              sendBtn.innerText = "Send";
              sendBtn.disabled = false;
          }
      });
  }

  // फॉर्म सबमिट होने पर OTP चेक करना और Supabase में डेटा डालना
  if (form) {  
    form.addEventListener('submit', async function(e) {
      e.preventDefault(); 

      const enteredOtp = document.getElementById('otpCode').value;

      if (!confirmationResult) {
          alert('कृपया पहले "Send" बटन दबाकर OTP मँगवाएं!');
          return;
      }

      try {
          // ऑनलाइन OTP वेरिफिकेशन
          await confirmationResult.confirm(enteredOtp);
          alert('OTP वेरिफिकेशन सफल रहा!');
      } catch (error) {
          alert('भाई, गलत OTP डाला है या यह एक्सपायर हो गया है! फिर से चेक कर.');
          return;
      }

      // अगर OTP सही है, तो डेटा Supabase में सेव होगा
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;
      const invite = document.getElementById('inviteCode').value;

      const { data, error } = await _supabase
        .from('users')
        .insert([
          { 
            phone_number: phone, 
            password_hash: password 
          }
        ]);

      if (error) {
        alert('डेटा सेव करने में दिक्कत आई: ' + error.message);
      } else {
        alert('डेटा सफलतापूर्वक सेव हो गया!');
        form.reset();
        confirmationResult = null; 
        if (window.recaptchaVerifier) {
            window.recaptchaVerifier.clear();
            window.recaptchaVerifier = null;
        }
      }
    });
  }
</script>

</body>
</html>
