<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .register-container { background-color: #ffffff; width: 100%; max-width: 400px; padding: 30px 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 35px; }
        .header h2 { color: #0d8c54; font-size: 22px; font-weight: 600; }
        .back-btn { color: #0d8c54; font-size: 20px; text-decoration: none; }
        .spacer { width: 20px; }
        .input-group { display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; background-color: #ffffff; }
        .input-group .icon { color: #0d8c54; font-size: 18px; margin-right: 12px; width: 20px; text-align: center; }
        .input-group input { border: none; outline: none; width: 100%; font-size: 15px; color: #333; }
        .phone-group .country-code { font-size: 15px; font-weight: 600; color: #0d8c54; margin-right: 10px; padding-right: 10px; border-right: 1px solid #e2e8f0; }
        .send-btn { background-color: #0d8c54; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500; }
        .signup-btn { background-color: #0d8c54; color: white; border: none; width: 100%; padding: 14px; font-size: 18px; font-weight: 500; border-radius: 30px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="header">
            <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Register</h2>
            <div class="spacer"></div>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-regular fa-user icon"></i>
                <input type="text" id="username" placeholder="User Name" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-group phone-group">
                <i class="fa-solid fa-phone icon"></i>
                <span class="country-code" id="countryCode">+91</span>
                <input type="tel" id="phone" placeholder="Phone" required>
            </div>

            <!-- सुरक्षा रीकैप्चा बॉक्स -->
            <div id="recaptcha-container" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>

            <div class="input-group otp-group">
                <i class="fa-regular fa-envelope icon"></i>
                <input type="text" id="otpCode" placeholder="OTP Code" required>
                <button type="button" class="send-btn" id="sendOtpBtn">Send</button>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-link icon"></i>
                <input type="text" id="inviteCode" placeholder="Invite Code">
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>
    </div>

<!-- Supabase डेटाबेस कनेक्शन का सही लिंक -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- असली Firebase SDK इंजन के सही लिंक्स -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD-wRwZiXZvrZWMlKAlxGvc_4I_yjXh7Uc",
    authDomain: "rk-pay-3c7e2.firebaseapp.com",
    projectId: "rk-pay-3c7e2",
    storageBucket: "rk-pay-3c7e2.firebasestorage.app",
    messagingSenderId: "945406958282",
    appId: "1:945406958282:web:863a1bff293441d665b233",
    measurementId: "G-7GE17PRFR1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.firebaseAuth = auth;
  window.signInWithPhoneNumber = signInWithPhoneNumber;

  window.onload = function() {
      try {
          window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
              'size': 'normal', 
              'callback': (response) => {
                  console.log("Google Verification Successful!");
              }
          });
          window.recaptchaVerifier.render();
      } catch (e) {
          console.error("Verification setup error:", e);
      }
  };
</script>

<script>
  // Supabase का सही URL और Key
  const supabaseUrl = 'https://epktoxtdzinybptgdhdu.supabase.co';
  const supabaseKey = 'sb_publishable_pQBVukXk63ShneEauRMZYw_F9NyOQ69';
  const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

  let confirmationResult = null;
  const sendBtn = document.getElementById('sendOtpBtn');
  const form = document.getElementById('loginForm');

  if (sendBtn) {
      sendBtn.addEventListener('click', async function() {
          const phoneInput = document.getElementById('phone').value;
          const countryCode = document.getElementById('countryCode').innerText;

          if (!phoneInput || phoneInput.length < 10) {
              alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें!');
              return;
          }

          const fullPhoneNumber = countryCode + phoneInput;

          try {
              sendBtn.innerText = "Sending...";
              sendBtn.disabled = true;

              const appVerifier = window.recaptchaVerifier;
              
              confirmationResult = await window.signInWithPhoneNumber(window.firebaseAuth, fullPhoneNumber, appVerifier);
              alert("Firebase की तरफ से आपके मोबाइल पर असली OTP भेज दिया गया है!");
              
          } catch (error) {
              alert("ओटीपी भेजने में एरर: " + error.message);
          } finally {
              sendBtn.innerText = "Send";
              sendBtn.disabled = false;
          }
      });
  }

  if (form) {  
    form.addEventListener('submit', async function(e) {
      e.preventDefault(); 
      const enteredOtp = document.getElementById('otpCode').value;

      if (!confirmationResult) {
          alert('कृपया पहले "Send" बटन दबाकर OTP मँगवाएं!');
          return;
      }

      try {
          await confirmationResult.confirm(enteredOtp);
          alert('OTP वेरिफिकेशन सफल रहा!');
      } catch (error) {
          alert('गलत OTP डाला है!');
          return;
      }

      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;

      const { data, error } = await _supabase
        .from('users')
        .insert([{ phone_number: phone, password_hash: password }]);

      if (error) {
        alert('डेटाबेस एरर: ' + error.message);
      } else {
        alert('सफलतापूर्वक डेटा सेव हो गया!');
        form.reset();
        confirmationResult = null;
      }
    });
  }
</script>
</body>
</html>
